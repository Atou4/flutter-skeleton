name: flutter_skeleton
description: A reusable Flutter skeleton with clean architecture, DI, routing, and state management.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  bloc: ^8.1.4
  connectivity_plus: ^6.0.3
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  get_it: ^7.7.0
  go_router: ^16.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.3.1
  retrofit: ^4.9.2
  rxdart: ^0.27.7
  shared_preferences: ^2.3.3

dev_dependencies:
  build_runner: ^2.10.4
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.1.1
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  retrofit_generator: ^10.2.3
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
